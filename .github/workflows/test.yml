name: API Test

# 触发方式：什么时候跑
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # 手动点一下也能跑
  schedule:
    - cron: "0 1 * * *"       # 每天 01:00 UTC = 北京时间 09:00 自动跑

# 同一分支只跑一个，新的把旧的顶掉，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 默认只读，发布 Pages 需要写权限
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 卡住自动失败，不会占着一整天

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: 1 拉代码
        uses: actions/checkout@v4

      - name: 2 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mall_server/requirements.txt
            requirements-dev.txt

      - name: 3 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r mall_server/requirements.txt -r requirements-dev.txt

      - name: 4 初始化数据库
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 < mall_server/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 < mall_server/seed.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 -e "USE mall; SELECT COUNT(*) AS users FROM users; SELECT COUNT(*) AS products FROM products;"

      - name: 5 生成数据库配置
        run: |
          cp mall_server/config.example.py mall_server/config.py
          python - <<'EOF'
          import re, pathlib
          p = pathlib.Path("mall_server/config.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'"password":\s*"[^"]*"', '"password": "123456"', s)
          p.write_text(s, encoding="utf-8")
          print(s)
          EOF

      - name: 6 启动被测服务
        run: |
          cd mall_server
          nohup python wsgi.py > ../app.log 2>&1 &
          echo $! > ../server.pid
          cd ..
          up=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "服务已就绪，用时 ${i}s"; up=1; break
            fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::服务 30 秒内没有起来"
            cat app.log || true
            exit 1
          fi
          curl -s http://127.0.0.1:5000/api/health

      - name: 7 跑接口用例
        run: |
          set -o pipefail
          pytest testcases -v \
            --junitxml=reports/junit.xml \
            --alluredir=allure-results \
            2>&1 | tee pytest.log

      - name: 8 失败时打印线索
        if: failure()
        run: |
          echo "----- 失败的用例 -----"
          grep -E "^(FAILED|ERROR)" pytest.log | head -n 30 || true
          echo "----- 断言细节 -----"
          grep -E "^E " pytest.log | head -n 60 || true
          grep -E "^(FAILED|ERROR)" pytest.log | head -n 30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "----- 被测服务日志 -----"
          cat app.log || true

      - name: 9 生成 Allure 报告
        if: always()
        run: |
          curl -sSL -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip -d /opt/
          /opt/allure-2.29.0/bin/allure generate allure-results -o allure-report --clean || true
          ls -la allure-report || true

      - name: 10 上传报告（Actions 页面可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            reports/
            allure-results/
            allure-report/
            pytest.log
            app.log
          if-no-files-found: ignore

      - name: 11 发布报告到 GitHub Pages（在线可查）
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: report
          keep_files: false
