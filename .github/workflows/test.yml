name: API Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install flask requests pytest

      - name: 启动待测系统
        run: |
          python bookstore/app.py > flask.log 2>&1 &
          sleep 3

      - name: 运行测试
        run: pytest testcases -v
